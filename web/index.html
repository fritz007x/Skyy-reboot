<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyy</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden;
               background: radial-gradient(circle at 50% 45%, #55b8f6 0%, #3e86cb 55%, #244b87 100%);
               font-family: "Segoe UI", system-ui, sans-serif; }
  canvas { display: block; }
  #status { position: fixed; left: 50%; bottom: 4vh; transform: translateX(-50%);
            padding: .5em 1.2em; border-radius: 2em; background: rgba(0, 0, 0, .55);
            color: #fff; font-size: clamp(16px, 2.4vh, 28px); white-space: nowrap; }
  #start { position: fixed; left: 50%; bottom: 12vh; transform: translateX(-50%);
           width: 12em; height: 3.2em;
           border: 0; border-radius: 2em; background: #fff; color: #1b4f9c;
           font: 600 clamp(18px, 3vh, 32px) "Segoe UI", system-ui, sans-serif;
           box-shadow: 0 .3em 1em rgba(0, 0, 0, .35); cursor: pointer; }
  #start[hidden] { display: none; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<!-- Finn in 3D (finn3d.js draws finn.glb with three.js), speaking in sync with Skyy's voice
     (voice.js analyses it). skyy.js connects to the bot. -->
<div id="status">Starting…</div>
<button id="start" hidden>Talk to Skyy</button>
<audio id="voice" autoplay></audio>
<script src="voice.js"></script>
<!-- modules run in order after the page is parsed: finn3d.js sets window.Finn first -->
<script type="module" src="finn3d.js"></script>
<script type="module" src="skyy.js"></script>
</body>
</html>
